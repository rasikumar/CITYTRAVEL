version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transitnow_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/transitnow
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=transitnow-super-secret-production-key-2026
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    container_name: transitnow_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transitnow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: transitnow_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
